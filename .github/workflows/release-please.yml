name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs['javascript--release_created'] }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC trusted publishing
    defaults:
      run:
        working-directory: javascript
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node # Node >= 22.14 required for OIDC trusted publishing
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      # pnpm's OIDC trusted-publishing handshake is broken (pnpm/pnpm#11513),
      # so publish with the npm CLI, which needs >= 11.5.1 for trusted publishing.
      - name: Update npm for OIDC trusted publishing
        run: npm install --global npm@latest
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - name: Install dependencies
        run: pnpm install
      - name: Build
        run: pnpm run build
      # pnpm builds; npm only uploads (--ignore-scripts skips the prepare rebuild).
      - name: Publish to npm with provenance
        run: npm publish --provenance --access public --ignore-scripts
